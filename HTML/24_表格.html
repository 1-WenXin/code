<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表格</title>
</head>
<body>
    <table border="1" width="500" height="600" cellspacing="0">
        <caption>基本信息</caption>
        <thead align="center">
            <tr>
                <th>性别</th>
                <th>年龄</th>
                <th>出生日期</th>
            </tr>
        </thead>
        <tbody align="center">
            <tr>
                <td>女</td>
                <td>9</td>
                <td>6.13</td>
            </tr>
            <tr>
                <td>男</td>
                <td>19</td>
                <td>9.13</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>总计6</td>
                <td></td>
                <td></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
